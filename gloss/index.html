<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000">
<title>Gloss</title>
<style>
@font-face { font-family: Plex; src: url(fonts/plex-sans-latin-400-normal.woff2) }
@font-face { font-family: Plex; font-style: italic;
  src: url(fonts/plex-sans-latin-400-italic.woff2) }
@font-face { font-family: Plex; font-weight: 500;
  src: url(fonts/plex-sans-latin-500-normal.woff2) }
@font-face { font-family: Mono;
  src: url(fonts/plex-mono-latin-400-normal.woff2) }
:root { --bg: #000; --fg: #f4f4f4; --mu: #8a8a8a; --dim: #4a4a4a;
  --ln: #1d1d1d; --sf: #0b0b0b; --side: 18.5rem; color-scheme: dark }
* { box-sizing: border-box }
html { scroll-padding-top: 4rem }
body { margin: 0; overflow-x: clip; background: var(--bg); color: var(--fg);
  font: 15px/1.6 Plex, system-ui, sans-serif; -webkit-font-smoothing:
  antialiased; text-rendering: optimizeLegibility }
a { color: inherit }
button, input { font: inherit; color: inherit }
::selection { background: var(--fg); color: var(--bg) }
.mono, .lab, .tag, aside h3, .sec, .bar, .meta, .count, kbd {
  font-family: Mono, ui-monospace, monospace; font-size: 11px;
  letter-spacing: .07em; text-transform: uppercase }

/* sidebar */
aside { position: fixed; inset: 0 auto 0 0; width: var(--side);
  display: flex; flex-direction: column; border-right: 1px solid var(--ln);
  background: var(--bg); z-index: 3; overflow: hidden }
.scroll { overflow-y: auto; flex: 1; padding: 2rem 1.75rem 1.5rem;
  scrollbar-width: thin; scrollbar-color: var(--dim) transparent }
.mark { font-weight: 500; font-size: 1.35rem; letter-spacing: -.02em;
  margin: 0; line-height: 1 }
.sub { color: var(--mu); margin: .55rem 0 0; font-size: 13px;
  line-height: 1.45 }
.search { position: relative; margin: 2rem 0 0 }
.search input { width: 100%; background: var(--sf); border: 1px solid
  var(--ln); padding: .6rem 2.4rem .6rem .75rem; outline: 0; font-size: 14px;
  transition: border-color .15s }
.search input:focus { border-color: var(--dim) }
.search input::placeholder { color: var(--mu) }
kbd { position: absolute; right: .55rem; top: 50%; translate: 0 -50%;
  color: var(--mu); border: 1px solid var(--ln); padding: 0 .35rem;
  font-size: 10px; pointer-events: none }
aside h3 { color: var(--mu); font-weight: 400; margin: 2.2rem 0 .7rem }
.opt { display: flex; align-items: center; gap: .7rem; width: 100%;
  background: none; border: 0; padding: .32rem 0; cursor: pointer;
  text-align: left; color: var(--mu); font-size: 14px; transition: color .15s }
.opt:hover, .opt[aria-pressed=true] { color: var(--fg) }
.opt .g { width: 1rem; text-align: center; font-size: 12px }
.opt .count { margin-left: auto; color: var(--dim) }
.opt[aria-pressed=true] .count { color: var(--mu) }
.seg { display: grid; grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--ln) }
.seg button { background: none; border: 0; padding: .45rem 0; font-size: 10px; cursor: pointer;
  color: var(--mu); font: 10px Mono, monospace; letter-spacing: .04em;
  text-transform: uppercase; transition: .15s }
.seg button + button { border-left: 1px solid var(--ln) }
.seg button[aria-pressed=true] { background: var(--fg); color: var(--bg) }
nav a { display: flex; gap: .7rem; text-decoration: none; color: var(--mu);
  font-size: 13px; padding: .22rem 0; transition: color .15s }
nav a:hover, nav a.on { color: var(--fg) }
nav a .count { margin-left: auto; color: var(--dim) }
nav a.on::before { content: ''; width: 3px; margin-left: -1.75rem;
  margin-right: calc(1.75rem - 3px - .7rem); background: var(--fg) }
.foot { border-top: 1px solid var(--ln); padding: 1rem 1.75rem;
  color: var(--mu); display: flex; gap: 1rem; flex-wrap: wrap }
.foot a { text-decoration: none } .foot a:hover { color: var(--fg) }
.reset { background: none; border: 0; padding: 0; margin-left: auto;
  cursor: pointer; color: var(--mu) } .reset:hover { color: var(--fg) }

/* main */
main { overflow-wrap: anywhere; margin-left: var(--side); padding: 0 clamp(1.5rem, 5vw, 4.5rem) 8rem;
  max-width: calc(var(--side) + 62rem) }
.lede { padding: 4.5rem 0 1rem; max-width: 40rem }
.lede h1 { font-weight: 500; font-size: clamp(1.7rem, 3.4vw, 2.6rem);
  line-height: 1.12; letter-spacing: -.025em; margin: 0 }
.lede p { color: var(--mu); margin: 1.2rem 0 0; max-width: 34rem }
.stat { display: flex; gap: 2.5rem; margin: 2.2rem 0 0; flex-wrap: wrap }
.stat b { display: block; font-weight: 400; font-size: 1.6rem;
  letter-spacing: -.02em; font-family: Plex }
.stat span { color: var(--mu) }
.sec { position: sticky; top: 0; z-index: 1; background: var(--bg);
  color: var(--mu); padding: 2.4rem 0 .8rem; margin: 0;
  border-bottom: 1px solid var(--fg); display: flex; font-weight: 400 }
.sec span { color: var(--fg) } .sec em { margin-left: auto; font-style: normal }
article { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr);
  gap: 0 2.2rem; padding: 1.8rem 0 1.9rem; border-bottom: 1px solid var(--ln) }
article:target { background: var(--sf); box-shadow: 0 0 0 1rem var(--sf);
  clip-path: inset(0 -1rem) }
.meta { color: var(--mu); display: flex; flex-direction: column;
  gap: .35rem; padding-top: .2rem }
.meta .tag { color: var(--fg) }
.dots { letter-spacing: .25em }
.meta a { text-decoration: none; color: var(--dim) }
.meta a:hover { color: var(--fg) }
.where { color: var(--mu); font-size: 13px }
.where i { font-style: normal; color: var(--fg); font-weight: 500 }
.lab { display: block; color: var(--dim); margin: 1.1rem 0 .3rem;
  font-size: 10px }
blockquote { margin: 0; font-size: 1.22rem; line-height: 1.45;
  letter-spacing: -.01em }
blockquote.s { font-size: 1.02rem; color: #b8b8b8; letter-spacing: 0 }
.src { margin-top: 1.1rem; font-size: 13px; color: var(--mu);
  line-height: 1.55 }
.src i { color: #cfcfcf }
.src a { text-decoration: underline; text-decoration-color: var(--dim);
  text-underline-offset: 3px } .src a:hover { color: var(--fg) }
mark { background: var(--fg); color: var(--bg); padding: 0 .1em }
.none { color: var(--mu); padding: 5rem 0; font-size: 1.1rem }

/* mobile: a bar that hides on scroll, the sidebar as a drawer */
.bar, .scrim, .x { display: none }
@media (max-width: 56rem) {
  html { scroll-padding-top: 6.5rem }
  aside { width: min(22rem, 88vw); translate: -100% 0;
    transition: translate .32s cubic-bezier(.2, .8, .2, 1);
    box-shadow: 0 0 0 100vmax transparent }
  body.open aside { translate: 0 }
  .scrim { display: block; position: fixed; inset: 0; z-index: 2;
    background: rgb(0 0 0 / .6); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .3s }
  body.open .scrim { opacity: 1; pointer-events: auto }
  body.open { overflow: hidden }
  .bar { display: flex; align-items: center; gap: 1rem; position: fixed;
    inset: 0 0 auto; z-index: 2; height: 3.25rem; padding: 0 1rem;
    background: rgb(0 0 0 / .82); backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--ln); transition: translate .3s }
  body.up .bar { translate: 0 -100% }
  .bar b { font: 500 15px Plex; letter-spacing: -.01em; text-transform: none }
  .bar span { color: var(--mu); margin-left: auto }
  .bar button { background: var(--fg); color: var(--bg); border: 0;
    padding: .45rem .8rem; cursor: pointer; font: inherit;
    letter-spacing: inherit }
  main { margin: 0; padding: 3.25rem 1.1rem 6rem }
  .lede { padding-top: 2.5rem }
  .sec { top: 3.25rem; transition: top .3s } body.up .sec { top: 0 }
  article { display: block; padding: 1.4rem 0 }
  .meta { flex-direction: row; gap: 1rem; margin-bottom: .5rem }
  .meta a { margin-left: auto }
  blockquote { font-size: 1.1rem }
  kbd { display: none }
  .x { display: block; float: right; background: none; border: 0;
    padding: 0; cursor: pointer; color: var(--mu) }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="bar"><b>Gloss</b><span id="bn"></span>
  <button id="open" aria-controls="side" aria-expanded="false">Filter</button>
</div>
<div class="scrim" id="scrim"></div>
<aside id="side">
  <div class="scroll">
    <button class="x mono" id="close" aria-label="Close">Close</button>
    <p class="mark">Gloss</p>
    <p class="sub">Sources quoted, adapted, echoed and alluded to in
      J. H. Prynne’s <i>Poems</i></p>
    <div class="search"><input type="search" id="q" placeholder="Search"
      aria-label="Search entries" autocomplete="off"><kbd>/</kbd></div>
    <h3>Type</h3><div id="ks"></div>
    <h3>Confidence</h3><div class="seg" id="cs"></div>
    <h3>Collections</h3><nav id="nv"></nav>
  </div>
  <div class="foot mono"><a href="gloss.xml" download>TEI</a>
    <a href="gloss.odd" download>ODD</a>
    <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
    <button class="reset mono" id="reset" hidden>Reset</button></div>
</aside>

<main>
  <header class="lede">
    <h1 id="t"></h1>
    <p id="d"></p>
    <div class="stat mono" id="st"></div>
  </header>
  <div id="m"></div>
</main>

<script type="module">
const $ = s => document.querySelector(s)
const T = 'http://www.tei-c.org/ns/1.0'
const XML = 'http://www.w3.org/XML/1998/namespace'
const x = new DOMParser().parseFromString(
  await (await fetch('gloss.xml')).text(), 'application/xml')
const all = (e, s) => [...e.getElementsByTagNameNS(T, s)]
const one = (e, s) => all(e, s)[0]
const kids = (e, s) => [...e.children].filter(c => c.localName === s)
const txt = e => e ? e.textContent.replace(/\s+/g, ' ').trim() : ''
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`)
const id = e => e.getAttributeNS(XML, 'id')
const B = Object.fromEntries(all(x, 'biblStruct').map(b => [id(b), b]))

const quote = q => q ? [...q.childNodes].map(n => n.nodeType === 3 ?
  esc(n.data) : n.localName === 'lb' ? ' / ' : n.localName === 'gap' ?
  ' … ' : esc(n.textContent)).join('').replace(/\s+/g, ' ').trim() : ''
const range = b => [...b.children].slice(1).map((r, i) => {
  if (r.localName === 'title') return i ? `– <i>${esc(txt(r))}</i>` : ''
  if (r.localName !== 'citedRange') return ''
  const u = r.getAttribute('unit'), f = r.getAttribute('from'),
    t = r.getAttribute('to'), a = { page: ['p.', 'pp.'],
      line: ['l.', 'll.'] }[u] || [u, u]
  if (!f && !t) return r.textContent ? (u === 'none' ? '' : u + ' ') +
    esc(r.textContent) : u
  return !f || !t ? `${a[0]} ${f || t}` : f === t ? `${a[0]} ${f}` :
    `${a[1]} ${f}–${t}`
}).filter(Boolean).join(', ').replace(/, –/g, ' –')
const LINK = { DOI: 'https://doi.org/', IA: 'https://archive.org/details/',
  Gutenberg: 'https://www.gutenberg.org/ebooks/',
  Wikidata: 'https://www.wikidata.org/wiki/' }
function cite(w) {
  const b = B[w]; if (!b) return w
  const an = one(b, 'analytic'), mo = one(b, 'monogr'), im = one(mo, 'imprint')
  const au = all(an || mo, 'author').map(txt).join(', ')
  const ti = an ? `‘${esc(txt(one(an, 'title')))}’, in <i>${esc(txt(one(mo,
    'title')))}</i>` : `<i>${esc(txt(one(mo, 'title')))}</i>`
  const ed = kids(mo, 'editor').map(txt).join(', ')
  const pub = [kids(im, 'pubPlace').map(txt).join(', '),
    kids(im, 'publisher').map(txt).join(', ')].filter(Boolean).join(': ')
  const d = one(im, 'date'), dt = d && (d.getAttribute('when') || txt(d))
  const ids = all(b, 'idno').map(i => { const t = i.getAttribute('type'),
    v = txt(i); return LINK[t] ? `<a href="${LINK[t]}${encodeURI(v)}">${t}</a>`
    : `${t} ${esc(v)}` })
  const imp = [pub, dt].filter(Boolean).map(esc).join(', ')
  return [au && esc(au), ti + (ed ? ', ed. ' + esc(ed) : '') +
    (imp ? ` (${imp})` : ''), ids.join(' · ')].filter(Boolean).join(', ')
}

const E = [], C = []
for (const dv of all(x, 'div')) {
  const coll = txt(one(dv, 'head')); C.push(coll)
  for (const c of kids(dv, 'cit')) {
    const pb = kids(c, 'bibl')[0], s = kids(c, 'cit')[0]
    const sb = kids(s, 'bibl')[0], seen = kids(sb, 'ptr')
      .find(p => p.getAttribute('type') === 'seen')
    const via = kids(s, 'bibl')[1]
    const work = kids(sb, 'ptr')[0].getAttribute('target').slice(1)
    const e = { id: id(c), kind: c.getAttribute('type'),
      cert: c.getAttribute('cert'), coll, poem: txt(one(pb, 'title')),
      where: range(pb), p: quote(kids(c, 'quote')[0]),
      s: quote(kids(s, 'quote')[0]), src: cite(work), loc: range(sb),
      seen: seen && seen.getAttribute('target'),
      via: via && cite(one(via, 'ptr').getAttribute('target').slice(1)) }
    e.hay = [e.poem, e.p, e.s, e.src, e.kind, e.coll].join(' ').toLowerCase()
      .replace(/<[^>]+>/g, '')
    E.push(e)
  }
}

// header
$('#t').textContent = 'Sources quoted, adapted, echoed and alluded to in ' +
  'J. H. Prynne’s Poems'
$('#d').textContent = 'Each entry pairs the words that Prynne and a source ' +
  'share, with the page and line of the poem and the edition in which the ' +
  'source was seen.'
const by = (k, v) => E.filter(e => e[k] === v).length
$('#st').innerHTML = [[E.length, 'entries'], [C.length, 'collections'],
  [new Set(E.map(e => e.src)).size, 'sources']]
  .map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('')

// controls
const KIND = { quotation: '■', adaptation: '◧', echo: '□', allusion: '○' }
const CERT = { high: '●●●', medium: '●●○', low: '●○○' }
const S = { q: '', k: new Set(Object.keys(KIND)), c: '' }
$('#ks').innerHTML = Object.keys(KIND).map(k => `<button class="opt"
  data-k="${k}" aria-pressed="true"><span class="g">${KIND[k]}</span>
  ${k[0].toUpperCase() + k.slice(1)}<span class="count">${by('kind', k)}
  </span></button>`).join('')
$('#cs').innerHTML = ['', 'high', 'medium', 'low'].map(c => `<button
  data-c="${c}" aria-pressed="${!c}">${c || 'All'}</button>`)
  .join('')
const slug = s => 'c-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-')

const hi = (h, ws) => ws.length ? h.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, t) =>
  tag || t.replace(new RegExp(ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,
    '\\$&')).join('|'), 'gi'), '<mark>$&</mark>')) : h
const card = (e, ws) => `<article id="${e.id}">
  <div class="meta"><span class="tag">${KIND[e.kind]} ${e.kind}</span>
  <span class="dots" title="${e.cert} confidence">${CERT[e.cert]}</span>
  <a href="#${e.id}">${e.id}</a></div><div>
  <div class="where"><i>${hi(esc(e.poem), ws)}</i> · ${e.where}</div>
  ${e.p ? `<span class="lab">Prynne</span><blockquote>${hi(e.p, ws)}
  </blockquote><span class="lab">Source</span><blockquote class="s">
  ${hi(e.s, ws)}</blockquote>` : ''}
  <div class="src">${hi(e.src, ws)}${e.loc ? ', ' + e.loc : ''}${e.seen ?
  ` · <a href="${esc(e.seen)}">seen</a>` : ''}${e.via ? `<br>via ${e.via}`
  : ''}</div></div></article>`

function draw() {
  const ws = S.q.toLowerCase().split(/\s+/).filter(Boolean)
  const r = E.filter(e => S.k.has(e.kind) && (!S.c || e.cert === S.c) &&
    ws.every(w => e.hay.includes(w)))
  const g = Map.groupBy ? Map.groupBy(r, e => e.coll) :
    r.reduce((m, e) => m.set(e.coll, [...(m.get(e.coll) || []), e]), new Map)
  $('#m').innerHTML = [...g].map(([c, es]) => `<section id="${slug(c)}">
    <h2 class="sec"><span>${esc(c)}</span><em>${es.length}</em></h2>
    ${es.map(e => card(e, ws)).join('')}</section>`).join('') ||
    '<p class="none">No entries match.</p>'
  $('#nv').innerHTML = C.filter(c => g.has(c)).map(c => `<a href="#${slug(c)}"
    data-c="${esc(c)}">${esc(c)}<span class="count">${g.get(c).length}
    </span></a>`).join('')
  const n = r.length, f = n < E.length
  $('#bn').textContent = f ? `${n} / ${E.length}` : `${n} entries`
  $('#open').textContent = f ? 'Filter •' : 'Filter'
  $('#reset').hidden = !f
  spy()
}

// scroll: hide the mobile bar going down; mark the collection in view
let y0 = 0
function spy() {
  const s = [...document.querySelectorAll('section')]
    .filter(s => s.getBoundingClientRect().top < innerHeight * .3).pop()
  for (const a of document.querySelectorAll('nav a'))
    a.classList.toggle('on', !!s && a.getAttribute('href') === '#' + s.id)
}
addEventListener('scroll', () => {
  const y = scrollY
  document.body.classList.toggle('up', y > y0 && y > 80); y0 = y; spy()
}, { passive: true })

const open = v => { document.body.classList.toggle('open', v)
  $('#open').setAttribute('aria-expanded', v) }
$('#open').onclick = () => open(true)
$('#scrim').onclick = $('#close').onclick = () => open(false)
$('#nv').onclick = e => e.target.closest('a') && open(false)
$('#ks').onclick = e => { const b = e.target.closest('button'); if (!b) return
  const k = b.dataset.k, on = S.k.has(k)
  if (on && S.k.size === 1) return
  on ? S.k.delete(k) : S.k.add(k); b.setAttribute('aria-pressed', !on); draw() }
$('#cs').onclick = e => { const b = e.target.closest('button'); if (!b) return
  S.c = b.dataset.c; for (const o of $('#cs').children)
    o.setAttribute('aria-pressed', o === b); draw() }
let tm; $('#q').oninput = e => { clearTimeout(tm)
  tm = setTimeout(() => { S.q = e.target.value; draw() }, 120) }
$('#reset').onclick = () => { S.q = $('#q').value = ''; S.c = ''
  S.k = new Set(Object.keys(KIND))
  document.querySelectorAll('[aria-pressed]').forEach(b =>
    b.setAttribute('aria-pressed', !!b.dataset.k || b.dataset.c === ''))
  draw() }
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) {
    e.preventDefault(); open(true); $('#q').focus() }
  if (e.key === 'Escape') { open(false); $('#q').blur() } })

draw()
if (location.hash) document.getElementById(location.hash.slice(1))
  ?.scrollIntoView()
</script>
