<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gloss release</title>
<style>
@font-face { font-family: Plex; src: url(fonts/plex-sans-latin-400-normal.woff2) }
@font-face { font-family: Plex; font-style: italic;
  src: url(fonts/plex-sans-latin-400-italic.woff2) }
@font-face { font-family: Plex; font-weight: 500;
  src: url(fonts/plex-sans-latin-500-normal.woff2) }
@font-face { font-family: PlexMono;
  src: url(fonts/plex-mono-latin-400-normal.woff2) }
:root { --bg: #000; --fg: #f2f2f2; --mu: #7a7a7a; --dim: #3a3a3a;
  --ln: #1c1c1c; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); margin: 0 auto;
  max-width: 64rem; padding: 4rem 1.5rem 6rem;
  font: 300 15px/1.65 Plex, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased }
.m, .h, .n, form, h2, header p { font-family: PlexMono, ui-monospace,
  monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase }
h1 { font-weight: 500; font-size: 1.6rem; line-height: 1.25; margin: 0;
  max-width: 34rem; letter-spacing: -.01em }
header p { color: var(--mu); margin: 1.2rem 0 0; max-width: 40rem;
  line-height: 1.8 }
form { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.4rem;
  margin: 3rem 0 0; padding: 1rem 0; position: sticky; top: 0; z-index: 1;
  background: var(--bg); border-bottom: 1px solid var(--fg) }
input[type=search] { flex: 1 1 14rem; font: inherit; letter-spacing: inherit;
  text-transform: none; color: var(--fg); background: transparent;
  border: 0; outline: 0; padding: .3rem 0 }
input[type=search]::placeholder { color: var(--mu); text-transform: uppercase }
label { cursor: pointer; color: var(--mu) }
label:has(:checked) { color: var(--fg) }
input[type=checkbox] { appearance: none; width: 7px; height: 7px; margin: 0
  .45rem 1px 0; border: 1px solid currentColor; vertical-align: middle }
input[type=checkbox]:checked { background: currentColor }
select { font: inherit; letter-spacing: inherit; text-transform: inherit;
  color: var(--fg); background: var(--bg); border: 1px solid var(--dim);
  padding: .25rem .4rem; border-radius: 0 }
.n { color: var(--mu); margin: 1rem 0 0 }
h2 { font-weight: 400; color: var(--mu); margin: 4rem 0 0; padding-bottom:
  .7rem; border-bottom: 1px solid var(--dim) }
article { display: grid; grid-template-columns: 11rem 1fr; gap: 0 2rem;
  padding: 1.6rem 0; border-bottom: 1px solid var(--ln) }
article > * { grid-column: 2 } article > .h { grid-column: 1;
  grid-row: 1 / span 9; color: var(--mu); line-height: 2 }
.h a { color: var(--mu); text-decoration: none } .h a:hover { color: var(--fg) }
.k { color: var(--fg) } .h > * { display: block }
article:target { background: #0d0d0d; box-shadow: -1.5rem 0 0 #0d0d0d,
  1.5rem 0 0 #0d0d0d }
.w { color: var(--fg) } .w i { font-style: normal; font-weight: 500;
  margin-right: .6rem }
blockquote { margin: .9rem 0 0; font-size: 1.15rem; line-height: 1.5 }
blockquote.s { color: var(--mu); font-size: 1rem; margin-top: .5rem }
.b { margin-top: .9rem; font-size: 13px; color: var(--mu) }
.b i { color: #bdbdbd } .b a { color: var(--fg); text-underline-offset: 3px;
  text-decoration-color: var(--dim) }
::selection { background: var(--fg); color: var(--bg) }
@media (max-width: 40rem) { body { padding: 2.5rem 1rem 4rem }
  article { display: block } .h { display: flex; gap: 1rem } }
</style>
<header>
  <h1 id="t">gloss</h1>
  <p id="d"></p>
</header>
<form id="f">
  <input type="search" id="q" placeholder="search words, poems, sources">
  <span id="ks"></span>
  <select id="c"><option value="">any certainty</option>
    <option>high</option><option>medium</option><option>low</option></select>
</form>
<p class="n" id="n"></p>
<main id="m"></main>
<script type="module">
const $ = s => document.querySelector(s)
const T = 'http://www.tei-c.org/ns/1.0'
const XML = 'http://www.w3.org/XML/1998/namespace'
const x = new DOMParser().parseFromString(
  await (await fetch('gloss.xml')).text(), 'application/xml')
const all = (e, s) => [...e.getElementsByTagNameNS(T, s)]
const one = (e, s) => all(e, s)[0]
const kids = (e, s) => [...e.children].filter(c => c.localName === s)
const txt = e => e ? e.textContent.replace(/\s+/g, ' ').trim() : ''
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`)
const id = e => e.getAttributeNS(XML, 'id')
const B = Object.fromEntries(all(x, 'biblStruct').map(b => [id(b), b]))

$('#t').textContent = txt(one(one(x, 'titleStmt'), 'title'))
$('#d').textContent = txt(one(x, 'edition')) + ' ' +
  txt(one(x, 'licence')).split('.')[0] + '.'

const quote = q => q ? [...q.childNodes].map(n => n.nodeType === 3 ?
  esc(n.data) : n.localName === 'lb' ? ' / ' : n.localName === 'gap' ?
  ' … ' : esc(n.textContent)).join('').replace(/\s+/g, ' ').trim() : ''
const range = b => [...b.children].slice(1).map((r, i) => {
  if (r.localName === 'title') return i ? `– <i>${esc(txt(r))}</i>` : ''
  if (r.localName !== 'citedRange') return ''
  const u = r.getAttribute('unit'), f = r.getAttribute('from'),
    t = r.getAttribute('to'), a = { page: ['p.', 'pp.'],
      line: ['l.', 'll.'] }[u] || [u, u]
  if (!f && !t) return r.textContent ? (u === 'none' ? '' : u + ' ') +
    esc(r.textContent) : u
  return !f || !t ? `${a[0]} ${f || t}` : f === t ? `${a[0]} ${f}` :
    `${a[1]} ${f}–${t}`
}).filter(Boolean).join(', ').replace(/, –/g, ' –')
const LINK = { DOI: 'https://doi.org/', IA: 'https://archive.org/details/',
  Gutenberg: 'https://www.gutenberg.org/ebooks/',
  Wikidata: 'https://www.wikidata.org/wiki/' }
function cite(w) {
  const b = B[w]; if (!b) return w
  const an = one(b, 'analytic'), mo = one(b, 'monogr'), im = one(mo, 'imprint')
  const au = all(an || mo, 'author').map(txt).join(', ')
  const ti = an ? `‘${txt(one(an, 'title'))}’, in <i>${esc(txt(one(mo,
    'title')))}</i>` : `<i>${esc(txt(one(mo, 'title')))}</i>`
  const ed = kids(mo, 'editor').map(txt).join(', ')
  const pub = [kids(im, 'pubPlace').map(txt).join(', '),
    kids(im, 'publisher').map(txt).join(', ')].filter(Boolean).join(': ')
  const d = one(im, 'date'), dt = d && (d.getAttribute('when') || txt(d))
  const ids = all(b, 'idno').map(i => { const t = i.getAttribute('type'),
    v = txt(i); return LINK[t] ? `<a href="${LINK[t]}${encodeURI(v)}">${t}</a>`
    : `${t} ${esc(v)}` })
  const im_ = [pub, dt].filter(Boolean).map(esc).join(', ')
  return [au && esc(au), ti + (ed ? ', ed. ' + esc(ed) : '') +
    (im_ ? ` (${im_})` : ''), ids.join(' · ')].filter(Boolean).join(', ')
}

const E = []
for (const dv of all(x, 'div')) {
  const coll = txt(one(dv, 'head'))
  for (const c of kids(dv, 'cit')) {
    const pb = kids(c, 'bibl')[0], s = kids(c, 'cit')[0]
    const sb = kids(s, 'bibl')[0], seen = kids(sb, 'ptr')
      .find(p => p.getAttribute('type') === 'seen')
    const via = kids(s, 'bibl')[1]
    const work = kids(sb, 'ptr')[0].getAttribute('target').slice(1)
    const e = { id: id(c), kind: c.getAttribute('type'),
      cert: c.getAttribute('cert'), coll, poem: txt(one(pb, 'title')),
      where: range(pb), p: quote(kids(c, 'quote')[0]),
      s: quote(kids(s, 'quote')[0]), src: cite(work), loc: range(sb),
      seen: seen && seen.getAttribute('target'),
      via: via && cite(one(via, 'ptr').getAttribute('target').slice(1)) }
    e.hay = [e.poem, e.p, e.s, e.src, e.kind].join(' ').toLowerCase()
    E.push(e)
  }
}

const K = [...new Set(E.map(e => e.kind))]
$('#ks').innerHTML = K.map(k => `<label><input type="checkbox" value="${k}"
  checked> ${k}</label>`).join(' ')
const card = e => `<article id="${e.id}"><div class="h"><span class="k">
  ${e.kind}</span><span>${e.cert}</span> <a href="#${e.id}">${e.id}</a></div>
  <div class="w"><i>${esc(e.poem)}</i> <span class="m">${e.where}</span></div>
  ${e.p ? `<blockquote>${e.p}</blockquote>` : ''}
  ${e.s ? `<blockquote class="s">${e.s}</blockquote>` : ''}
  <div class="b">${e.src}${e.loc ? ', ' + e.loc : ''}${e.seen ?
  ` · <a href="${esc(e.seen)}">seen</a>` : ''}${e.via ? `<br>via ${e.via}`
  : ''}</div></article>`
function draw() {
  const q = $('#q').value.toLowerCase().trim(), c = $('#c').value
  const ks = new Set([...$('#ks').querySelectorAll(':checked')]
    .map(i => i.value))
  const r = E.filter(e => ks.has(e.kind) && (!c || e.cert === c) &&
    q.split(/\s+/).every(w => e.hay.includes(w)))
  let h = '', last
  for (const e of r) {
    if (e.coll !== last) h += `<h2>${esc(last = e.coll)}</h2>`
    h += card(e)
  }
  $('#m').innerHTML = h
  $('#n').textContent = `${r.length} of ${E.length} entries`
}
$('#f').addEventListener('input', draw)
$('#f').addEventListener('submit', e => e.preventDefault())
draw()
if (location.hash) document.getElementById(location.hash.slice(1))
  ?.scrollIntoView()
</script>
